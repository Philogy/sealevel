[package]
name = "sealevel-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
alloy-primitives = { version = "1.6.1", features = ["serde"] }
alloy-provider = { version = "1.6.1", features = ["reqwest"] }
anyhow = "1"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
